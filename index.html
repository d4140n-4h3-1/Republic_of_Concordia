<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Constitution of Concordia, a fictional nation: ten Articles, bills, and education and economic acts, with linked citations and search.">
    <title>Constitution of Concordia</title>
    <link rel="icon" href="site/emblem.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
    <link rel="stylesheet" href="site/style.css">
    <script>
        // Apply the saved theme before first paint.
        try {
            const theme = localStorage.getItem("concordia-theme");
            if (theme) document.documentElement.dataset.theme = theme;
        } catch (e) {}
    </script>
</head>
<body>
    <a class="skip-link" href="#content">Skip to the text</a>

    <header class="masthead">
        <button class="icon-button menu-button" id="menu-button" aria-label="Open the library" aria-controls="library" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="brand" href="#/">
            <img src="site/emblem.svg" alt="" width="34" height="34">
            <span class="brand-text">
                <span class="brand-name">Concordia</span>
                <span class="brand-sub">The Constitution &amp; Its Laws</span>
            </span>
        </a>
        <div class="search" role="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search-input" type="search" placeholder="Search, or jump to a citation like I.4.c" autocomplete="off" aria-label="Search the documents" aria-controls="search-results">
            <kbd class="search-key" aria-hidden="true">/</kbd>
            <div class="search-results" id="search-results" role="listbox" hidden></div>
        </div>
        <button class="icon-button" id="theme-button" aria-label="Switch between light and dark themes">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
    </header>
    <div class="stripe" aria-hidden="true"></div>

    <div class="layout">
        <nav class="library" id="library" aria-label="Library">
            <div class="library-inner" id="library-list"></div>
        </nav>
        <div class="scrim" id="scrim" hidden></div>

        <main id="content" class="content" tabindex="-1">
            <p class="loading">Loading…</p>
        </main>

        <aside class="outline" id="outline" aria-label="On this page"></aside>
    </div>

    <div class="cite-preview" id="cite-preview" role="tooltip" hidden></div>

    <footer class="site-footer">
        <p>Concordia is a fictional nation. This is a work of worldbuilding, not legal advice, and it proposes no real legislation.</p>
        <p><a href="https://github.com/d4140n-4h3-1/Republic_of_Concordia">Source on GitHub</a> · <a href="https://github.com/d4140n-4h3-1/Republic_of_Concordia/blob/main/LICENSE">License</a></p>
    </footer>

    <script src="site/vendor/marked.min.js"></script>
    <script src="site/app.js"></script>
</body>
</html>
